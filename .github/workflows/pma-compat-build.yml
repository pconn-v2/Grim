name: Pma Compat Build

on:
  pull_request:
    branches:
      - ver/26.3
      - pma/pmapaper-compat-26.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and build
        run: |
          chmod +x gradlew
          ./gradlew :common:test build --no-daemon --stacktrace
      - name: Attach Bukkit test build
        uses: actions/upload-artifact@v4
        with:
          name: pma-grim-bukkit
          path: bukkit/build/libs/*.jar
          retention-days: 7
          if-no-files-found: warn
